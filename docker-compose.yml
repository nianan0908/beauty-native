services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qiguang
      POSTGRES_USER: qiguang
      POSTGRES_PASSWORD: qiguang
    ports:
      - "5432:5432"
    volumes:
      - qiguang_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiguang -d qiguang"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - qiguang_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && uv run --no-sync python -m scripts.seed_demo
    environment: &backend-environment
      QIGUANG_ENVIRONMENT: development
      QIGUANG_DEBUG: "false"
      QIGUANG_DATABASE_URL: postgresql+asyncpg://qiguang:qiguang@postgres:5432/qiguang
      QIGUANG_REDIS_URL: redis://redis:6379/0
      QIGUANG_CORS_ORIGINS: '["http://localhost:5173"]'
      QIGUANG_JWT_SECRET: local-compose-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["uv", "run", "--no-sync", "dramatiq", "app.worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  qiguang_postgres_data:
  qiguang_redis_data:
